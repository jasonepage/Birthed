<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How Birthed fits together</title>
  <rect width="960" height="400" rx="14" fill="#120E18"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#B9B0A8"/>
    </marker>
  </defs>

  <text x="40" y="46" fill="#F3EDE4" font-size="17" font-weight="700">How it fits together</text>
  <text x="40" y="68" fill="#9C9490" font-size="12.5">One database. The worker fills it, readers read it, and a buzz goes in through one checked path.</text>

  <!-- sources -->
  <text x="40" y="104" fill="#9C9490" font-size="11" font-weight="700" letter-spacing="1.2">WHERE FACTS COME FROM</text>
  <g font-size="12.5" fill="#F3EDE4">
    <rect x="40" y="116" width="200" height="40" rx="6" fill="#2A2233"/><text x="56" y="141">Wikidata: people</text>
    <rect x="40" y="164" width="200" height="40" rx="6" fill="#2A2233"/><text x="56" y="189">Wikipedia: events, charts</text>
    <rect x="40" y="212" width="200" height="40" rx="6" fill="#2A2233"/><text x="56" y="237">Public news feeds</text>
    <rect x="40" y="260" width="200" height="40" rx="6" fill="#2A2233"/><text x="56" y="285">Wikimedia Commons: pictures</text>
  </g>
  <line x1="244" y1="208" x2="290" y2="208" stroke="#B9B0A8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- worker -->
  <rect x="294" y="140" width="200" height="136" rx="8" fill="#1E1826" stroke="#E7A83A" stroke-width="1.6"/>
  <text x="310" y="166" fill="#E7A83A" font-size="14" font-weight="800">worker/</text>
  <text x="310" y="188" fill="#F3EDE4" font-size="12">Runs every 15 minutes.</text>
  <text x="310" y="206" fill="#F3EDE4" font-size="12">Imports, checks every</text>
  <text x="310" y="222" fill="#F3EDE4" font-size="12">cited page, cuts the board.</text>
  <text x="310" y="248" fill="#9C9490" font-size="11">The only holder of the</text>
  <text x="310" y="263" fill="#9C9490" font-size="11">service role key.</text>
  <line x1="498" y1="208" x2="544" y2="208" stroke="#B9B0A8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="521" y="199" fill="#9C9490" font-size="10.5" text-anchor="middle">writes</text>

  <!-- database -->
  <rect x="548" y="140" width="170" height="136" rx="8" fill="#1E1826" stroke="#EF5680" stroke-width="1.6"/>
  <text x="564" y="166" fill="#EF5680" font-size="14" font-weight="800">Supabase</text>
  <text x="564" y="188" fill="#F3EDE4" font-size="12">Postgres. Row level</text>
  <text x="564" y="204" fill="#F3EDE4" font-size="12">security on every table.</text>
  <text x="564" y="222" fill="#F3EDE4" font-size="12">Buzzes are immutable.</text>
  <text x="564" y="248" fill="#9C9490" font-size="11">Edge Functions for the</text>
  <text x="564" y="263" fill="#9C9490" font-size="11">fact finder and buzzing.</text>

  <!-- readers -->
  <line x1="722" y1="180" x2="768" y2="150" stroke="#B9B0A8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="722" y1="236" x2="768" y2="266" stroke="#B9B0A8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="772" y="100" width="148" height="96" rx="8" fill="#2A2233"/>
  <text x="786" y="124" fill="#F3EDE4" font-size="13.5" font-weight="800">birthed.app</text>
  <text x="786" y="144" fill="#B9B0A8" font-size="11.5">366 pages baked at</text>
  <text x="786" y="160" fill="#B9B0A8" font-size="11.5">deploy. Only open</text>
  <text x="786" y="176" fill="#B9B0A8" font-size="11.5">dates read live.</text>
  <rect x="772" y="220" width="148" height="96" rx="8" fill="#2A2233"/>
  <text x="786" y="244" fill="#F3EDE4" font-size="13.5" font-weight="800">iPhone app</text>
  <text x="786" y="264" fill="#B9B0A8" font-size="11.5">Swift, no packages.</text>
  <text x="786" y="280" fill="#B9B0A8" font-size="11.5">A silent account,</text>
  <text x="786" y="296" fill="#B9B0A8" font-size="11.5">no sign in screen.</text>

  <text x="40" y="352" fill="#9C9490" font-size="12">No analytics service, no advertising code, no third party script. The website and the app hold only the</text>
  <text x="40" y="370" fill="#9C9490" font-size="12">anonymous key, so everything they can read is decided by the database's own rules.</text>
</svg>
