<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The life of a hive</title>
  <rect width="960" height="300" rx="14" fill="#120E18"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E7A83A"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#EF5680"/>
    </marker>
  </defs>

  <text x="40" y="46" fill="#F3EDE4" font-size="17" font-weight="700">The life of one date's hive</text>
  <text x="40" y="68" fill="#9C9490" font-size="12.5">Every calendar date gets a new hive every year. Times are United States Eastern.</text>

  <!-- the bar -->
  <rect x="40" y="110" width="200" height="54" rx="6" fill="#2A2233" stroke="#4A3F55"/>
  <text x="140" y="133" fill="#F3EDE4" font-size="13.5" font-weight="700" text-anchor="middle">The day before</text>
  <text x="140" y="152" fill="#B9B0A8" font-size="12" text-anchor="middle">opens for stories</text>

  <rect x="244" y="110" width="250" height="54" rx="6" fill="#E7A83A"/>
  <text x="369" y="133" fill="#2A1A08" font-size="13.5" font-weight="800" text-anchor="middle">The date itself</text>
  <text x="369" y="152" fill="#2A1A08" font-size="12" text-anchor="middle">three buzzes each</text>

  <rect x="498" y="110" width="190" height="54" rx="6" fill="#EFE0B8"/>
  <text x="593" y="133" fill="#2A1A08" font-size="13.5" font-weight="800" text-anchor="middle">The day after</text>
  <text x="593" y="152" fill="#2A1A08" font-size="12" text-anchor="middle">one more buzz</text>

  <line x1="692" y1="137" x2="752" y2="137" stroke="#E7A83A" stroke-width="2" marker-end="url(#a)"/>
  <text x="722" y="126" fill="#E7A83A" font-size="11" text-anchor="middle">midnight</text>

  <rect x="758" y="110" width="162" height="54" rx="6" fill="none" stroke="#E7A83A" stroke-width="2"/>
  <text x="839" y="133" fill="#F3EDE4" font-size="13.5" font-weight="700" text-anchor="middle">Sealed</text>
  <text x="839" y="152" fill="#B9B0A8" font-size="12" text-anchor="middle">permanent, no edits</text>

  <!-- what a buzz does -->
  <line x1="369" y1="168" x2="369" y2="196" stroke="#E7A83A" stroke-dasharray="3 3"/>
  <line x1="593" y1="168" x2="593" y2="196" stroke="#EFE0B8" stroke-dasharray="3 3"/>
  <text x="481" y="214" fill="#F3EDE4" font-size="12.5" text-anchor="middle">One tap is one buzz. One story takes one buzz from you.</text>
  <text x="481" y="232" fill="#9C9490" font-size="12" text-anchor="middle">A tile's size on the board is its share of the date's buzzes.</text>

  <!-- the loop back -->
  <path d="M839 168 L839 272 L140 272 L140 170" fill="none" stroke="#EF5680" stroke-width="1.6" marker-end="url(#p)"/>
  <text x="489" y="264" fill="#EF5680" font-size="12" font-weight="700" text-anchor="middle">Same date next year: a new hive opens, and every old one stays readable.</text>
</svg>
