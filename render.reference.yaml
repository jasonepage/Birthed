# REFERENCE ONLY, NOT A BLUEPRINT (2026-10-17). Renamed from render.yaml on purpose so
# Render can never read it again. A Render Blueprint matches services by NAME. This file
# names "birthed-web" and "birthed-wall", but the live service in the Render dashboard is "Birthed Web", so every
# Blueprint sync failed or tried to build a duplicate (paid) service.
#
# The live service is managed in the Render dashboard and deploys from GitHub on every
# push by itself. Change its settings there, not here. With no Blueprint reading this
# file, renaming services in the dashboard is safe. Do not rename this file back.
# Hosting for birthed.app, the search surface.
#
# To deploy: Render dashboard, New, Blueprint, point it at this repository. It
# reads this file, creates the service, and asks for the one value that is not
# in here.
#
# That value is SUPABASE_ANON_KEY. It is marked sync: false, which means Render
# prompts for it once and stores it, and it never appears in this file or
# anywhere else in the repository. It is the anonymous key, which is safe in a
# client by design and is protected by row level security. The service role key
# is not here and must never be: it bypasses row level security. CLAUDE.md
# section 9.
#
# Why a web service and not a static site: Render's static sites have no
# Starter plan. Static hosting is the free product, and Starter is a plan for
# services, so a paid tier means running a process. web/src/serve.ts is that
# process: it reads the already rendered files off disk, sets the headers, and
# has no dependencies and no database connection. A Supabase outage cannot take
# the site down, because the pages were built before the deploy.
#
# The pages are baked into each deploy. After the importer adds people, redeploy
# to pick them up.
#
# The second service is the worker's clock. docs/the-wall.md section 11 found
# that two documents assumed a scheduled worker that was never created, and
# section 12 records this as the answer: one cron job that seeds each open
# wall from the public news feeds and then runs the checker. Section 12 said
# every fifteen minutes; it has been every hour since October 11, 2026, see
# the cron job below and CLAUDE.md section 5. It builds from the worker's own
# Dockerfile and carries the service role key, which the web service never
# does. Nothing on birthed.app depends on it running: a tick that fails
# leaves the wall as it was.

services:
  - type: web
    name: birthed-web
    runtime: node
    plan: starter
    # Same coast as the Supabase project, which only matters at build time,
    # and same coast as most of the traffic.
    region: oregon
    rootDir: web

    # npm install rather than npm ci, because web/ has no lockfile yet. When one
    # is committed, switch this to `npm ci --include=dev`, which builds the
    # lockfile's dependency tree instead of whatever is newest today.
    #
    # --include=dev because typescript and playwright are development
    # dependencies, and a build with NODE_ENV set to production skips both.
    #
    # og:ci is the share pictures, 732 of them, and since October 11, 2026 it
    # shoots them only when something that draws them changed. web/src/og-ci.ts
    # fingerprints og.ts, every source it imports and the covers and faces the
    # cards inline, and keeps the last good set with its fingerprint under
    # $XDG_CACHE_HOME, which Render preserves between builds (cleared by
    # "Clear build cache & deploy" or past seven gigabytes). A build whose
    # fingerprint matches and whose cache holds every picture copies them into
    # out/og and never downloads Chromium; that was most of the build minutes.
    # Anything else generates: a changed template, an empty or cleared cache,
    # a short set, or OG_FORCE=1 set on the service for a deploy that should
    # refresh the pictures for new data (a data change does not move the
    # fingerprint on its own). The build log says which, and why.
    #
    # Skipping when unchanged is not tolerating failure. When it generates it
    # is still allowed to fail the deploy rather than ship short, on purpose:
    # every page carries an og:image tag pointing at /og/<date>.png, so a site
    # that ships without them has 366 broken link previews and nothing to
    # notice it by. A generator that exits non-zero, or writes fewer than 732
    # pictures, fails the build. If Render's build image will not run
    # Chromium, generate them locally with `npm run og`, un-ignore web/out/og,
    # commit them, and drop og:ci here.
    buildCommand: npm install --include=dev && npm run site && npm run og:ci
    startCommand: node dist/src/serve.js
    healthCheckPath: /healthz

    # Only rebuild when something that changes the site changes. The iOS target,
    # the worker and the specs do not.
    buildFilter:
      paths:
        - web/**
      ignoredPaths:
        - web/test/**

    # birthed.app and www.birthed.app are attached to this service in the
    # Render dashboard, not here. They were listed here until October 10, 2026,
    # when every sync began failing with "services[0].domains: one of the
    # domains is already taken": the Blueprint tried to claim domains the
    # service already held, and a failed sync means nothing else in this file
    # is applied either, which is how the cron schedule below sat unchanged
    # after it was committed. The domains do not move when they leave this
    # file; a Blueprint sync never detaches a domain the dashboard holds.

    envVars:
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"

  - type: cron
    name: birthed-wall
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    # Every hour, on the hour. It was every quarter hour until October 11,
    # 2026. Until October 14, 2026 the tick ended with two editor calls that
    # paid a model per run; they are gone (CLAUDE.md section 5, slice 0 of
    # the pivot) and nothing on this schedule calls a model now. What the
    # hourly cadence costs: the day's news reaches the hive within the hour
    # rather than within fifteen minutes, and a never-passed source gets one
    # retry in its first hour rather than four (worker/src/wall/recheck.ts).
    # The seal is not affected: it reads closes_at, not the tick. The sentence
    # the page shows after a buzz ("The hive redraws every hour") must match
    # this line, and a test in web/test/wall.test.ts pins the sentence.
    schedule: "0 * * * *"
    dockerCommand: node dist/src/wall/tick.js

    buildFilter:
      paths:
        - worker/**
      ignoredPaths:
        - worker/test/**

    envVars:
      - key: SUPABASE_URL
        value: https://lunqqhjwqrpbujwxwdzk.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WIKIDATA_CONTACT
        value: contact@birthed.app
      # Node sizes its own heap from the memory it can see, and on this plan it
      # settles on about 256 megabytes inside a container that has 512. On
      # September 22, 2026 the tick died with "Reached heap limit Allocation
      # failed" on every run for an hour, and the log showed it giving up at
      # 252 of 258 megabytes with half the container unused. The oversized
      # reads that pushed it over are capped now, in page.ts and
      # story-pictures.ts, but the tick loads sixteen open days and eleven
      # thousand stories and that number only grows, so it is also given room
      # it already had. Well under 512, because the heap is not the whole of
      # what the process uses.
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
