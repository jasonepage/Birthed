# Hosting for birthed.app, the search surface.
#
# To deploy: Render dashboard, New, Blueprint, point it at this repository. It
# reads this file, creates the service, and asks for the one value that is not
# in here.
#
# That value is SUPABASE_ANON_KEY. It is marked sync: false, which means Render
# prompts for it once and stores it, and it never appears in this file or
# anywhere else in the repository. It is the anonymous key, which is safe in a
# client by design and is protected by row level security. The service role key
# is not here and must never be: it bypasses row level security. CLAUDE.md
# section 9.
#
# Why a web service and not a static site: Render's static sites have no
# Starter plan. Static hosting is the free product, and Starter is a plan for
# services, so a paid tier means running a process. web/src/serve.ts is that
# process: it reads the already rendered files off disk, sets the headers, and
# has no dependencies and no database connection. A Supabase outage cannot take
# the site down, because the pages were built before the deploy.
#
# The pages are baked into each deploy. After the importer adds people, redeploy
# to pick them up.
#
# The second service is the worker's clock. docs/the-wall.md section 11 found
# that two documents assumed a scheduled worker that was never created, and
# section 12 records this as the answer: one cron job, every fifteen minutes,
# that seeds each open wall from the public news feeds and then runs the
# checker. It builds from the worker's own Dockerfile and carries the service
# role key, which the web service never does. Nothing on birthed.app depends
# on it running: a tick that fails leaves the wall as it was.

services:
  - type: web
    name: birthed-web
    runtime: node
    plan: starter
    # Same coast as the Supabase project, which only matters at build time,
    # and same coast as most of the traffic.
    region: oregon
    rootDir: web

    # npm install rather than npm ci, because web/ has no lockfile yet. When one
    # is committed, switch this to `npm ci --include=dev`, which builds the
    # lockfile's dependency tree instead of whatever is newest today.
    #
    # --include=dev because typescript and playwright are development
    # dependencies, and a build with NODE_ENV set to production skips both.
    #
    # og:ci downloads Chromium and shoots the 366 share images. It is allowed to
    # fail the deploy rather than be skipped, on purpose: every page carries an
    # og:image tag pointing at /og/<date>.png, so a site that ships without them
    # has 366 broken link previews and nothing to notice it by. If Render's
    # build image will not run Chromium, generate them locally with
    # `npm run og`, un-ignore web/out/og, commit them, and drop og:ci here.
    buildCommand: npm install --include=dev && npm run site && npm run og:ci
    startCommand: node dist/src/serve.js
    healthCheckPath: /healthz

    # Only rebuild when something that changes the site changes. The iOS target,
    # the worker and the specs do not.
    buildFilter:
      paths:
        - web/**
      ignoredPaths:
        - web/test/**

    domains:
      - birthed.app
      - www.birthed.app

    envVars:
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"

  - type: cron
    name: birthed-wall
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    # Every quarter hour. The checker fetches every source on every open
    # wall and the seeder reads six feeds, which is a minute or two of work.
    schedule: "*/15 * * * *"
    dockerCommand: node dist/src/wall/tick.js

    buildFilter:
      paths:
        - worker/**
      ignoredPaths:
        - worker/test/**

    envVars:
      - key: SUPABASE_URL
        value: https://lunqqhjwqrpbujwxwdzk.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WIKIDATA_CONTACT
        value: contact@birthed.app
      # Node sizes its own heap from the memory it can see, and on this plan it
      # settles on about 256 megabytes inside a container that has 512. On
      # September 22, 2026 the tick died with "Reached heap limit Allocation
      # failed" on every run for an hour, and the log showed it giving up at
      # 252 of 258 megabytes with half the container unused. The oversized
      # reads that pushed it over are capped now, in page.ts and
      # story-pictures.ts, but the tick loads sixteen open days and eleven
      # thousand stories and that number only grows, so it is also given room
      # it already had. Well under 512, because the heap is not the whole of
      # what the process uses.
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
